name: Fork Image

# Fork image build: compiles the Temps server from a branch of the fork and
# publishes a linux/amd64 image built from Dockerfile.release, so a fork can
# run its own patches on top of upstream `main` without waiting for an
# upstream release.
#
# Local builds are the default: run scripts/fork/build-image.sh on the build
# machine (low-priority cargo, no registry push). This workflow is a manual
# fallback that only runs on workflow_dispatch; it no longer triggers on push.
#
# Every job is guarded by `github.repository == 'thecotne/temps'`, so this
# workflow is inert if it is ever merged upstream or copied to another fork.
#
# The build steps mirror release.yml (web assets -> Linux AMD64 binary ->
# Dockerfile.release image) with the same SHA-pinned actions, minus the
# multi-platform matrix, the release/tag creation, and the runtime image
# set. No TEMPS_RELEASE_IMAGE_MANIFEST is embedded, so the binary uses the
# pinned upstream sandbox/preview-gateway defaults that source builds use.
#
# Outputs:
#   ghcr.io/<owner>/temps:sha-<12-char sha>
#   ghcr.io/<owner>/temps:<sanitized ref name>
#   ghcr.io/<owner>/temps:<sanitized ref name>-<suffix>   (dispatch input)
#   workflow artifact `temps-image-<12-char sha>`: `docker save` of the
#   sha tag, gzipped, loadable with `docker load -i` without registry access.
#
# Cache policy: the Rust dependency cache is saved only from `production`,
# the one ref that rebuilds repeatedly; every other ref restores only. The
# Bun and Docker layer caches stay restore-only, as in release.yml.

on:
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: "Optional suffix: also tag the image as <ref>-<suffix>"
        required: false
        type: string
        default: ""

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  RUST_BACKTRACE: 1

permissions: {}

jobs:
  build-web-assets:
    name: Build web assets (WASM + dist)
    if: github.repository == 'thecotne/temps'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      image: ${{ steps.meta.outputs.image }}
      sha12: ${{ steps.meta.outputs.sha12 }}
      tags: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.meta.outputs.version }}
      artifact: ${{ steps.meta.outputs.artifact }}
    steps:
      - name: Compute image metadata
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
          TAG_SUFFIX: ${{ inputs.tag_suffix }}
        run: |
          set -euo pipefail
          # Docker tag grammar: [A-Za-z0-9_][A-Za-z0-9_.-]{0,127}.
          sanitize() {
            local value
            value="$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/-+$//')"
            printf '%s' "${value:0:128}"
          }
          sha12="${GITHUB_SHA::12}"
          ref_tag="$(sanitize "$REF_NAME")"
          if [[ -z "$ref_tag" ]]; then
            echo "::error::ref name '$REF_NAME' sanitizes to an empty Docker tag"
            exit 1
          fi
          image="ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/temps"
          tags="${image}:sha-${sha12}"$'\n'"${image}:${ref_tag}"
          suffix="$(sanitize "${TAG_SUFFIX:-}")"
          if [[ -n "$suffix" ]]; then
            tags+=$'\n'"${image}:$(sanitize "${ref_tag}-${suffix}")"
          fi
          {
            echo "image=${image}"
            echo "sha12=${sha12}"
            echo "version=${ref_tag}-${sha12}"
            echo "artifact=temps-image-${sha12}"
            echo "tags<<EOF_TAGS"
            printf '%s\n' "${tags}"
            echo "EOF_TAGS"
          } >> "$GITHUB_OUTPUT"
          printf 'Image tags:\n%s\n' "${tags}"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Restore Bun dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: web/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('web/bun.lock') }}

      - name: Install web dependencies
        run: |
          cd web
          bun install --frozen-lockfile

      - name: Install wasm-pack and Build WASM
        run: |
          cargo install wasm-pack --version 0.15.0 --locked
          cd crates/temps-captcha-wasm
          bun run build

      - name: Build web dist
        run: |
          cd web
          bun run build
        env:
          RSBUILD_OUTPUT_PATH: ${{ github.workspace }}/crates/temps-cli/dist
          TEMPS_VERSION: ${{ steps.meta.outputs.version }}

      - name: Upload web dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-dist
          path: crates/temps-cli/dist
          retention-days: 1

  build-linux-amd64:
    name: Build Linux AMD64
    needs: build-web-assets
    if: github.repository == 'thecotne/temps'
    # Same glibc floor as release.yml: ubuntu-22.04 (glibc 2.35). The image
    # base (debian:bookworm-slim, glibc 2.36) runs it unchanged.
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libssl-dev protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Cache dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: linux-amd64-release
          save-if: ${{ github.ref == 'refs/heads/production' }}

      - name: Download web dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: web-dist
          path: crates/temps-cli/dist

      - name: Build release binary
        run: cargo build --release --bin temps
        env:
          SKIP_WEB_BUILD: 1
          CARGO_INCREMENTAL: 0
          TEMPS_VERSION: ${{ needs.build-web-assets.outputs.version }}

      - name: Strip binary
        run: strip target/release/temps

      - name: Rename binary
        run: cp target/release/temps temps

      - name: Create tarball
        run: |
          tar -czf temps-linux-amd64.tar.gz temps LICENSE LICENSE-MIT NOTICE
          ls -lh temps-linux-amd64.tar.gz

      - name: Generate checksum
        run: |
          sha256sum temps-linux-amd64.tar.gz > temps-linux-amd64.tar.gz.sha256
          cat temps-linux-amd64.tar.gz.sha256

      - name: Get binary info
        run: |
          file temps
          ./temps --version || echo "Note: Binary may require runtime dependencies"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: temps-linux-amd64
          path: |
            temps-linux-amd64.tar.gz
            temps-linux-amd64.tar.gz.sha256
          retention-days: 1

  build-and-push-docker:
    name: Build and Push Docker Image (linux/amd64)
    needs: [build-web-assets, build-linux-amd64]
    if: github.repository == 'thecotne/temps'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: temps-linux-amd64
          path: artifacts

      - name: Extract binary
        run: |
          cd artifacts
          sha256sum -c temps-linux-amd64.tar.gz.sha256
          tar -xzf temps-linux-amd64.tar.gz
          chmod +x temps
          ls -lh temps
          file temps

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          cache-binary: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile.release
          platforms: linux/amd64
          push: true
          tags: ${{ needs.build-web-assets.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.build-web-assets.outputs.version }}
            org.opencontainers.image.title=Temps
            org.opencontainers.image.description=Open-source platform for deploying and managing applications
          cache-from: type=gha

      # Pull the pushed tag back so the exported archive is byte-for-byte the
      # image in the registry, then save it for credential-free downloads.
      - name: Export image archive
        id: export
        env:
          IMAGE: ${{ needs.build-web-assets.outputs.image }}
          SHA12: ${{ needs.build-web-assets.outputs.sha12 }}
          ARTIFACT: ${{ needs.build-web-assets.outputs.artifact }}
        run: |
          set -euo pipefail
          ref="${IMAGE}:sha-${SHA12}"
          docker pull --platform linux/amd64 "$ref"
          image_id="$(docker image inspect --format '{{.Id}}' "$ref")"
          archive="${RUNNER_TEMP}/${ARTIFACT}.tar.gz"
          docker save "$ref" | gzip -6 > "$archive"
          ls -lh "$archive"
          {
            echo "image_id=${image_id}"
            echo "archive=${archive}"
            echo "archive_size=$(du -h "$archive" | cut -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload image archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ needs.build-web-assets.outputs.artifact }}
          path: ${{ steps.export.outputs.archive }}
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

      - name: Write job summary
        env:
          IMAGE: ${{ needs.build-web-assets.outputs.image }}
          SHA12: ${{ needs.build-web-assets.outputs.sha12 }}
          TAGS: ${{ needs.build-web-assets.outputs.tags }}
          ARTIFACT: ${{ needs.build-web-assets.outputs.artifact }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_ID: ${{ steps.export.outputs.image_id }}
          ARCHIVE_SIZE: ${{ steps.export.outputs.archive_size }}
        run: |
          set -euo pipefail
          echo "Image digest: ${DIGEST}"
          echo "::notice title=Image digest::${IMAGE}@${DIGEST}"
          {
            echo "## Fork image (linux/amd64)"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Revision | \`${GITHUB_SHA}\` |"
            echo "| Digest | \`${IMAGE}@${DIGEST}\` |"
            echo "| Image ID | \`${IMAGE_ID}\` |"
            echo "| Artifact | \`${ARTIFACT}\` (${ARCHIVE_SIZE}, docker save + gzip, 14 days) |"
            echo
            echo "Tags:"
            echo
            while IFS= read -r tag; do
              [[ -n "$tag" ]] && echo "- \`${tag}\`"
            done <<< "${TAGS}"
            echo
            echo "Load without registry credentials:"
            echo
            echo '```sh'
            echo "gh run download ${GITHUB_RUN_ID} -R ${GITHUB_REPOSITORY} -n ${ARTIFACT}"
            echo "docker load -i ${ARTIFACT}.tar.gz"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
